name: ${COMPOSE_PROJECT_NAME:-openg2p-developer}

services:
  refugee-postgres:
    image: postgres:16
    container_name: refugee-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: postgres
    ports:
      - "${REFUGEE_POSTGRES_PORT:-5435}:5432"
    volumes:
      - refugee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  refugee-redis:
    image: redis:7-alpine
    container_name: refugee-redis
    ports:
      - "${REFUGEE_REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  refugee-keycloak:
    image: quay.io/keycloak/keycloak:26.0
    platform: linux/amd64
    container_name: refugee-keycloak
    depends_on:
      refugee-postgres:
        condition: service_healthy
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://refugee-postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_SUPERUSER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${REFUGEE_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${REFUGEE_KEYCLOAK_ADMIN_PASSWORD:-CHANGE_ME}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "${REFUGEE_KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  refugee-iam-staff-api:
    image: ${IAM_STAFF_PORTAL_API_IMAGE:-openg2p/iam-staff-portal-api:1.3.0}
    container_name: refugee-iam-staff-api
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      refugee-postgres:
        condition: service_healthy
      refugee-redis:
        condition: service_healthy
      refugee-keycloak:
        condition: service_healthy
    env_file:
      - ${REFUGEE_ENV_DIR:-./env}/isolated-iam-staff-portal-api.env.example
    environment:
      IAM_STAFF_APP_PORT: "8000"
      IAM_API_PORT: "8000"
      IAM_STAFF_DATA_DIR: /opt/iam-staff-portal-data
    volumes:
      - ${REFUGEE_DEPLOY_DIR:-.}/iam-data:/opt/iam-staff-portal-data:ro
    ports:
      - "${REFUGEE_IAM_STAFF_PORT:-8120}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  refugee-awe:
    image: ${AWE_API_IMAGE:-openg2p/openg2p-awe:develop}
    container_name: refugee-awe
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      refugee-postgres:
        condition: service_healthy
      refugee-keycloak:
        condition: service_healthy
    env_file:
      - ${REFUGEE_ENV_DIR:-./env}/isolated-awe-api.env.example
    environment:
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
      CONFIG_PATH: /app/config/default.yaml
    volumes:
      - ${REFUGEE_DEPLOY_DIR:-.}/awe-config.yaml.example:/app/config/default.yaml:ro
    ports:
      - "${REFUGEE_AWE_API_PORT:-8130}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/awe/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  refugee-id-generator:
    image: ${ID_GENERATOR_IMAGE:-openg2p/openg2p-id-generator:1.0.0}
    platform: linux/amd64
    container_name: refugee-id-generator
    depends_on:
      refugee-postgres:
        condition: service_healthy
    environment:
      DB_HOST: refugee-postgres
      DB_PORT: 5432
      DB_NAME: idgenerator
      DB_USER: ${POSTGRES_SUPERUSER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      CONFIG_PATH: /app/config/default.yaml
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
      UVICORN_LOG_LEVEL: info
    ports:
      - "${REFUGEE_ID_GENERATOR_PORT:-8140}:8000"
    volumes:
      - ${REFUGEE_DEPLOY_DIR:-.}/id-generator.refugee.yaml:/app/config/default.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/idgenerator/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  refugee_postgres_data:
