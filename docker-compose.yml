name: ${COMPOSE_PROJECT_NAME:-refugee-registry}

services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    ports:
      - "${REFUGEE_POSTGRES_PORT:-5535}:5432"
    volumes:
      - refugee_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REFUGEE_REDIS_PORT:-6481}:6379"
    volumes:
      - refugee_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-refugeeadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${REFUGEE_MINIO_PORT:-9100}:9000"
      - "${REFUGEE_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - refugee_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${REFUGEE_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${REFUGEE_KEYCLOAK_ADMIN_PASSWORD:?REFUGEE_KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "${REFUGEE_KEYCLOAK_PORT:-8280}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  iam-staff-api:
    image: openg2p/iam-staff-portal-api:1.3.0
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      IAM_STAFF_APP_HOST: "0.0.0.0"
      IAM_STAFF_APP_PORT: "8000"
      IAM_API_PORT: "8000"
      IAM_STAFF_AUTH_REDIS_URL: "redis://redis:6379/0"
      IAM_STAFF_AUTH_TRANSACTION_STORE_BACKEND: redis
      IAM_STAFF_DB_DRIVER: postgresql+asyncpg
      IAM_STAFF_DB_HOSTNAME: postgres
      IAM_STAFF_DB_USERNAME: ${POSTGRES_USER:-postgres}
      IAM_STAFF_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      IAM_STAFF_DB_DBNAME: iam_staff
      IAM_STAFF_DB_PORT: "5432"
      IAM_STAFF_OPENAPI_ROOT_PATH: /
      IAM_STAFF_LOGIN_PROVIDERS_TABLE_ENABLED: "true"
      IAM_STAFF_AUTH_ENABLED: "true"
      IAM_STAFF_AUTH_COOKIE_HTTPONLY: "true"
      IAM_STAFF_AUTH_COOKIE_PATH: /
      IAM_STAFF_AUTH_COOKIE_DOMAIN: localhost
      IAM_STAFF_AUTH_COOKIE_MAX_AGE: "1800"
      IAM_STAFF_AUTH_COOKIE_SET_EXPIRES: "true"
      IAM_STAFF_AUTH_COOKIE_SECURE: "false"
      IAM_STAFF_DATA_DIR: /opt/iam-staff-portal-data
      IAM_STAFF_DATA_APPLICATION_URLS__KEYCLOAK_APPLICATION_URL: "http://localhost:${REFUGEE_KEYCLOAK_PORT:-8280}"
      IAM_STAFF_DATA_APPLICATION_URLS__REGISTRY_APPLICATION_URL: "http://localhost:${REFUGEE_UI_PORT:-3150}"
      IAM_STAFF_DATA_APPLICATION_URLS__MINIO_APPLICATION_URL: "http://localhost:${REFUGEE_MINIO_PORT:-9100}"
      IAM_STAFF_DATA_CLIENT_SECRETS__STAFF_KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_IAM_CLIENT_SECRET:?KEYCLOAK_IAM_CLIENT_SECRET is required}
      IAM_STAFF_CORS_ALLOW_ORIGINS: '["*"]'
    volumes:
      - ./docker/generated/iam-data:/opt/iam-staff-portal-data:ro
    ports:
      - "${REFUGEE_IAM_PORT:-8220}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping')\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  awe:
    image: openg2p/openg2p-awe:develop
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: awe
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CONFIG_PATH: /app/config/default.yaml
      AWE__KEYCLOAK__BASE_URL: "http://keycloak:8080"
      AWE__KEYCLOAK__REALM: ${REFUGEE_KEYCLOAK_REALM:-refugee}
      AWE__KEYCLOAK__ADMIN_CLIENT_ID: awe-admin-resolver
      AWE__KEYCLOAK__ADMIN_CLIENT_SECRET: ${KEYCLOAK_AWE_RESOLVER_CLIENT_SECRET:?KEYCLOAK_AWE_RESOLVER_CLIENT_SECRET is required}
      AWE__KEYCLOAK__ISSUER: "http://localhost:${REFUGEE_KEYCLOAK_PORT:-8280}/realms/${REFUGEE_KEYCLOAK_REALM:-refugee}"
      AWE__KEYCLOAK__JWKS_URL: "http://keycloak:8080/realms/${REFUGEE_KEYCLOAK_REALM:-refugee}/protocol/openid-connect/certs"
      AWE__KEYCLOAK__AUDIENCE: ""
    volumes:
      - ./docker/config/awe-config.yaml:/app/config/default.yaml:ro
    ports:
      - "${REFUGEE_AWE_PORT:-8230}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/awe/health')\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  id-generator:
    image: openg2p/openg2p-id-generator:1.0.0
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: idgenerator
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CONFIG_PATH: /app/config/default.yaml
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
      UVICORN_LOG_LEVEL: info
    volumes:
      - ./docker/config/id-generator.yaml:/app/config/default.yaml:ro
    ports:
      - "${REFUGEE_IDGEN_PORT:-8240}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/idgenerator/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  master-data-api:
    image: openg2p/master-data-api:develop
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      iam-staff-api:
        condition: service_healthy
    environment:
      MASTER_DATA_API_HOST: "0.0.0.0"
      MASTER_DATA_API_PORT: "8000"
      MASTER_DATA_API_NO_OF_WORKERS: "2"
      MASTER_DATA_API_OPENAPI_ROOT_PATH: /
      MASTER_DATA_API_WORKER_TYPE: gunicorn
      MASTER_DATA_API_DB_DRIVER: postgresql+asyncpg
      MASTER_DATA_API_DB_HOSTNAME: postgres
      MASTER_DATA_API_DB_PORT: "5432"
      MASTER_DATA_API_DB_USERNAME: ${POSTGRES_USER:-postgres}
      MASTER_DATA_API_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MASTER_DATA_API_DB_DBNAME: ${REFUGEE_MASTER_DATA_DB:-refugee_master_data_db}
      MASTER_DATA_API_AUTH_ENABLED: "false"
      MASTER_DATA_API_AUTH_REDIS_URL: "redis://redis:6379/0"
      MASTER_DATA_API_AUTH_PROVIDER_API_URL: "http://iam-staff-api:8000"
      MASTER_DATA_API_KEYCLOAK_CLIENT_ID: ${REFUGEE_KEYCLOAK_CLIENT_ID:-refugee-registry-staff-portal}
      MASTER_DATA_API_AUTH_VERIFY_SSL: "false"
      COMMON_AUTH_ENABLED: "false"
      COMMON_AUTH_PROVIDER_API_URL: "http://iam-staff-api:8000"
      COMMON_KEYCLOAK_CLIENT_ID: ${REFUGEE_KEYCLOAK_CLIENT_ID:-refugee-registry-staff-portal}
      COMMON_AUTH_REDIS_URL: "redis://redis:6379/0"
      COMMON_AUTH_VERIFY_SSL: "false"
      GEN2_MASTER_DATA_API_HOST: "0.0.0.0"
      GEN2_MASTER_DATA_API_PORT: "8000"
      GEN2_MASTER_DATA_API_DB_DRIVER: postgresql+asyncpg
      GEN2_MASTER_DATA_API_DB_HOSTNAME: postgres
      GEN2_MASTER_DATA_API_DB_PORT: "5432"
      GEN2_MASTER_DATA_API_DB_USERNAME: ${POSTGRES_USER:-postgres}
      GEN2_MASTER_DATA_API_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      GEN2_MASTER_DATA_API_DB_DBNAME: ${REFUGEE_MASTER_DATA_DB:-refugee_master_data_db}
    ports:
      - "${REFUGEE_MDS_API_PORT:-8249}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping')\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  staff-api:
    build:
      context: .
      dockerfile: docker/staff-api/Dockerfile
      args:
        RP_VERSION: ${RP_VERSION:-0.0.0-develop.716}
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      iam-staff-api:
        condition: service_healthy
      awe:
        condition: service_healthy
      id-generator:
        condition: service_healthy
      master-data-api:
        condition: service_healthy
    environment:
      REGISTRY_EXTENSION_MODULE: openg2p_registry_refugee_extension
      STAFF_PORTAL_PORT: "8000"
      REGISTRY_STAFF_PORTAL_API_PORT: "8000"
      REGISTRY_STAFF_PORTAL_API_APP_HOST: "0.0.0.0"
      REGISTRY_STAFF_PORTAL_API_APP_PORT: "8000"
      REGISTRY_STAFF_PORTAL_API_DB_DRIVER: postgresql+asyncpg
      REGISTRY_STAFF_PORTAL_API_DB_USERNAME: ${POSTGRES_USER:-postgres}
      REGISTRY_STAFF_PORTAL_API_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REGISTRY_STAFF_PORTAL_API_DB_HOSTNAME: postgres
      REGISTRY_STAFF_PORTAL_API_DB_PORT: "5432"
      REGISTRY_STAFF_PORTAL_API_DB_DBNAME: ${REFUGEE_REGISTRY_DB:-refugee_registry_db}
      REGISTRY_STAFF_PORTAL_API_MINIO_ENDPOINT: "minio:9000"
      REGISTRY_STAFF_PORTAL_API_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-refugeeadmin}
      REGISTRY_STAFF_PORTAL_API_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      REGISTRY_STAFF_PORTAL_API_MINIO_SECURE: "false"
      REGISTRY_STAFF_PORTAL_API_MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-default_bucket}
      REGISTRY_STAFF_PORTAL_API_TEMPLATE_BUCKET_NAME: templates
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_DRIVER: postgresql+asyncpg
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_USERNAME: ${POSTGRES_USER:-postgres}
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_HOSTNAME: postgres
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_PORT: "5432"
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_DBNAME: ${REFUGEE_MASTER_DATA_DB:-refugee_master_data_db}
      REGISTRY_STAFF_PORTAL_API_AUTH_ENABLED: "false"
      REGISTRY_STAFF_PORTAL_API_AUTH_PROVIDER_API_URL: "http://iam-staff-api:8000"
      REGISTRY_STAFF_PORTAL_API_KEYCLOAK_CLIENT_ID: ${REFUGEE_KEYCLOAK_CLIENT_ID:-refugee-registry-staff-portal}
      REGISTRY_STAFF_PORTAL_API_AUTH_REDIS_URL: "redis://redis:6379/0"
      REGISTRY_STAFF_PORTAL_API_REGISTRANT_AUTH_REDIS_URL: "redis://redis:6379/0"
      REGISTRY_STAFF_PORTAL_API_AUDIT_ENABLED: "false"
      REGISTRY_STAFF_PORTAL_API_OPENAPI_ROOT_PATH: /
      REGISTRY_STAFF_PORTAL_API_CORS_ALLOW_ORIGINS: '["*"]'
      REGISTRY_STAFF_PORTAL_API_AWE_ENABLED: "true"
      REGISTRY_STAFF_PORTAL_API_AWE_BASE_URL: "http://awe:8000"
      REGISTRY_STAFF_PORTAL_API_AWE_DEFAULT_CALLBACK_URL: "http://staff-api:8000/awe/webhooks/decision"
      REGISTRY_STAFF_PORTAL_API_AWE_CALLBACK_SECRET_ID: ${AWE_CALLBACK_SECRET_ID:-00000000-0000-4000-8000-000000000005}
      REGISTRY_STAFF_PORTAL_API_AWE_CALLBACK_HMAC_SECRET: ${AWE_CALLBACK_HMAC_SECRET:?AWE_CALLBACK_HMAC_SECRET is required}
      AWE_CALLBACK_SECRET_ID: ${AWE_CALLBACK_SECRET_ID:-00000000-0000-4000-8000-000000000005}
      AWE_CALLBACK_CALLER_SERVICE: ${AWE_CALLBACK_CALLER_SERVICE:-refugee}
      KEYCLOAK_BASE_URL: "http://keycloak:8080"
      APPROVER_RESOLVER_BASE_URL: "http://staff-api:8000"
      APPROVER_RESOLVER_SECRET: ${APPROVER_RESOLVER_SECRET:?APPROVER_RESOLVER_SECRET is required}
      FARMER_REGISTRY_ENRICHMENT_ENABLED: "false"
    ports:
      - "${REFUGEE_STAFF_API_PORT:-8271}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping')\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
      args:
        RP_VERSION: ${RP_VERSION:-0.0.0-develop.716}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      id-generator:
        condition: service_healthy
      staff-api:
        condition: service_healthy
    environment:
      REGISTRY_EXTENSION_MODULE: openg2p_registry_refugee_extension
      CELERY_APP: openg2p_registry_celery_worker.main.celery_app
      CELERY_OPTS: worker -Q refugee_registry_worker_queue --loglevel=info
      REGISTRY_CELERY_WORKERS_DB_USERNAME: ${POSTGRES_USER:-postgres}
      REGISTRY_CELERY_WORKERS_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REGISTRY_CELERY_WORKERS_DB_HOSTNAME: postgres
      REGISTRY_CELERY_WORKERS_DB_PORT: "5432"
      REGISTRY_CELERY_WORKERS_DB_DBNAME: ${REFUGEE_REGISTRY_DB:-refugee_registry_db}
      REGISTRY_CELERY_WORKERS_CELERY_BROKER_URL: "redis://redis:6379/7"
      REGISTRY_CELERY_WORKERS_CELERY_BACKEND_URL: "redis://redis:6379/7"
      REGISTRY_CELERY_WORKERS_WORKER_QUEUE: refugee_registry_worker_queue
      REGISTRY_CELERY_WORKERS_BATCH_SIZE: "2000"
      REGISTRY_CELERY_WORKERS_WORKER_MAX_ATTEMPTS: "5"
      REGISTRY_CELERY_WORKERS_MINIO_ENDPOINT: "minio:9000"
      REGISTRY_CELERY_WORKERS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-refugeeadmin}
      REGISTRY_CELERY_WORKERS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      REGISTRY_CELERY_WORKERS_MINIO_SECURE: "false"
      REGISTRY_CELERY_WORKERS_MINIO_BUCKET_NAME: templates
      REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_DRIVER: postgresql+asyncpg
      REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_USERNAME: ${POSTGRES_USER:-postgres}
      REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_HOSTNAME: postgres
      REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_PORT: "5432"
      REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_DBNAME: ${REFUGEE_MASTER_DATA_DB:-refugee_master_data_db}
      REGISTRY_CELERY_WORKERS_FUNCTIONAL_ID_GENERATION_URL: "http://id-generator:8000/v1"
      REGISTRY_CELERY_WORKERS_ID_GENERATION_ALLOCATION_PATH: "/idgenerator/{id_type}/id"
      REGISTRY_CELERY_WORKERS_ID_GENERATION_UPDATION_PATH: ""
    healthcheck:
      test: ["CMD-SHELL", "celery -A openg2p_registry_celery_worker.main.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
      args:
        RP_VERSION: ${RP_VERSION:-0.0.0-develop.716}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      staff-api:
        condition: service_healthy
    environment:
      REGISTRY_EXTENSION_MODULE: openg2p_registry_refugee_extension
      CELERY_APP: openg2p_registry_celery_beat.main.celery_app
      CELERY_OPTS: worker --beat -Q celery --loglevel=info --schedule=/tmp/celery-beat-schedule.db
      REGISTRY_CELERY_BEAT_DB_USERNAME: ${POSTGRES_USER:-postgres}
      REGISTRY_CELERY_BEAT_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REGISTRY_CELERY_BEAT_DB_HOSTNAME: postgres
      REGISTRY_CELERY_BEAT_DB_PORT: "5432"
      REGISTRY_CELERY_BEAT_DB_DBNAME: ${REFUGEE_REGISTRY_DB:-refugee_registry_db}
      REGISTRY_CELERY_BEAT_CELERY_BROKER_URL: "redis://redis:6379/7"
      REGISTRY_CELERY_BEAT_CELERY_BACKEND_URL: "redis://redis:6379/7"
      REGISTRY_CELERY_BEAT_WORKER_QUEUE: refugee_registry_worker_queue
      REGISTRY_CELERY_BEAT_BATCH_SIZE: "2000"
      REGISTRY_CELERY_BEAT_NO_OF_TASKS_TO_PROCESS: "4"
      REGISTRY_CELERY_BEAT_DATA_TRANSFORMATION_BEAT_PRODUCER_FREQUENCY: "20"
      REGISTRY_CELERY_BEAT_INGEST_DATA_BEAT_PRODUCER_FREQUENCY: "20"
      REGISTRY_CELERY_BEAT_INGEST_DATA_CLASSIFICATION_BEAT_PRODUCER_FREQUENCY: "20"
      REGISTRY_CELERY_BEAT_OUTGEST_DATA_PUBLISH_BEAT_PRODUCER_FREQUENCY: "20"
      REGISTRY_CELERY_BEAT_OUTGEST_TOPIC_REGISTER_BEAT_PRODUCER_FREQUENCY: "20"
      REGISTRY_CELERY_BEAT_DEDUPLICATION_BEAT_PRODUCER_FREQUENCY: "30"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery-beat-schedule.db || pgrep -f celery >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  staff-ui:
    image: openg2p/openg2p-registry-staff-ui:${RP_VERSION:-0.0.0-develop.716}
    depends_on:
      staff-api:
        condition: service_healthy
      master-data-api:
        condition: service_healthy
      iam-staff-api:
        condition: service_healthy
    environment:
      PORT: "3000"
      BACKEND_API_URL: "http://staff-api:8000"
      MASTERDATA_BACKEND_API_URL: "http://master-data-api:8000"
      DEFAULT_LOCALE: en
      PARTNER_IMPORT_EXPORT_ENABLE: "true"
      PAGE_SIZE: "10"
      IAM_URL: "http://iam-staff-api:8000"
      KEYCLOAK_LOGOUT_URL: "http://localhost:${REFUGEE_KEYCLOAK_PORT:-8280}/realms/${REFUGEE_KEYCLOAK_REALM:-refugee}/protocol/openid-connect/logout"
      LOGIN_PROVIDER_ID: "1"
      APPLICATION_MNEMONIC: ${REFUGEE_KEYCLOAK_CLIENT_ID:-refugee-registry-staff-portal}
      COOKIE_DOMAIN: localhost
      REDIRECT_URL: "http://localhost:${REFUGEE_UI_PORT:-3150}"
    ports:
      - "${REFUGEE_UI_PORT:-3150}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/en').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  bootstrap-core:
    profiles: [bootstrap]
    build:
      context: ./docker/bootstrap
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-staff-api:
        condition: service_healthy
      awe:
        condition: service_healthy
      id-generator:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-refugeeadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-default_bucket}
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      IDGEN_INTERNAL_URL: "http://id-generator:8000"
      REFUGEE_KEYCLOAK_REALM: ${REFUGEE_KEYCLOAK_REALM:-refugee}
      REFUGEE_KEYCLOAK_ADMIN: ${REFUGEE_KEYCLOAK_ADMIN:-admin}
      REFUGEE_KEYCLOAK_ADMIN_PASSWORD: ${REFUGEE_KEYCLOAK_ADMIN_PASSWORD:?REFUGEE_KEYCLOAK_ADMIN_PASSWORD is required}
      KEYCLOAK_IAM_CLIENT_SECRET: ${KEYCLOAK_IAM_CLIENT_SECRET:?KEYCLOAK_IAM_CLIENT_SECRET is required}
      KEYCLOAK_AWE_RESOLVER_CLIENT_SECRET: ${KEYCLOAK_AWE_RESOLVER_CLIENT_SECRET:?KEYCLOAK_AWE_RESOLVER_CLIENT_SECRET is required}
      REFUGEE_DEMO_USER_PASSWORD: ${REFUGEE_DEMO_USER_PASSWORD:?REFUGEE_DEMO_USER_PASSWORD is required}
      REFUGEE_KEYCLOAK_PORT: ${REFUGEE_KEYCLOAK_PORT:-8280}
      REFUGEE_IAM_PORT: ${REFUGEE_IAM_PORT:-8220}
      REFUGEE_UI_PORT: ${REFUGEE_UI_PORT:-3150}
      AWE_CALLBACK_SECRET_ID: ${AWE_CALLBACK_SECRET_ID:-00000000-0000-4000-8000-000000000005}
      AWE_CALLBACK_CALLER_SERVICE: ${AWE_CALLBACK_CALLER_SERVICE:-refugee}
      AWE_CALLBACK_HMAC_SECRET: ${AWE_CALLBACK_HMAC_SECRET:?AWE_CALLBACK_HMAC_SECRET is required}
      IAM_STAFF_DB_DRIVER: postgresql+asyncpg
      IAM_STAFF_DB_HOSTNAME: postgres
      IAM_STAFF_DB_USERNAME: ${POSTGRES_USER:-postgres}
      IAM_STAFF_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      IAM_STAFF_DB_DBNAME: iam_staff
      IAM_STAFF_DB_PORT: "5432"
    restart: "no"

  mds-seed:
    profiles: [bootstrap]
    build:
      context: ./docker/mds-seed
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      master-data-api:
        condition: service_healthy
    environment:
      MD_PGHOST: postgres
      MD_PGPORT: "5432"
      MD_PGDATABASE: ${REFUGEE_MASTER_DATA_DB:-refugee_master_data_db}
      MD_PGUSER: ${POSTGRES_USER:-postgres}
      MD_PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REFUGEE_CODELISTS_SRC: /data/codelists/refugee
    volumes:
      - ./data/codelists/refugee:/data/codelists/refugee:ro
    restart: "no"

  db-seed:
    profiles: [bootstrap]
    build:
      context: .
      dockerfile: docker/db-seed/Dockerfile
      args:
        RP_VERSION: ${RP_VERSION:-0.0.0-develop.716}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      master-data-api:
        condition: service_healthy
      awe:
        condition: service_healthy
      staff-api:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${REFUGEE_REGISTRY_DB:-refugee_registry_db}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MD_PGHOST: postgres
      MD_PGPORT: "5432"
      MD_PGDATABASE: ${REFUGEE_MASTER_DATA_DB:-refugee_master_data_db}
      MD_PGUSER: ${POSTGRES_USER:-postgres}
      MD_PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AWE_DB_SEED_ENABLED: "true"
      AWE_PGHOST: postgres
      AWE_PGPORT: "5432"
      AWE_PGDATABASE: awe
      AWE_PGUSER: ${POSTGRES_USER:-postgres}
      AWE_PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AWE_CALLBACK_SECRET_ID: ${AWE_CALLBACK_SECRET_ID:-00000000-0000-4000-8000-000000000005}
      AWE_CALLBACK_HMAC_SECRET: ${AWE_CALLBACK_HMAC_SECRET:?AWE_CALLBACK_HMAC_SECRET is required}
      AWE_CALLBACK_CALLER_SERVICE: ${AWE_CALLBACK_CALLER_SERVICE:-refugee}
      KEYCLOAK_BASE_URL: "http://keycloak:8080"
      APPROVER_RESOLVER_BASE_URL: "http://staff-api:8000"
      APPROVER_RESOLVER_SECRET: ${APPROVER_RESOLVER_SECRET:?APPROVER_RESOLVER_SECRET is required}
      MDS_API_URL: "http://master-data-api:8000"
      MDS_TOKEN_URL: "http://keycloak:8080/realms/${REFUGEE_KEYCLOAK_REALM:-refugee}/protocol/openid-connect/token"
      MDS_CLIENT_ID: awe-admin-resolver
      MDS_CLIENT_SECRET: ${KEYCLOAK_AWE_RESOLVER_CLIENT_SECRET:?KEYCLOAK_AWE_RESOLVER_CLIENT_SECRET is required}
      LOAD_SAMPLE_DATA: ${LOAD_SAMPLE_DATA:-true}
      LOAD_GEO_DATA: "false"
      LOAD_ETHIOPIA_GEO: "false"
      LOAD_CODE_LISTS: "false"
      LOAD_IMAGES: "false"
      LOAD_TEMPLATES: "false"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-refugeeadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SECURE: "false"
      TEMPLATE_BUCKET_NAME: templates
      IMAGE_BUCKET_NAME: registrant-photos
    restart: "no"

volumes:
  refugee_postgres_data:
  refugee_redis_data:
  refugee_minio_data:
